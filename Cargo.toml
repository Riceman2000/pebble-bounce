[package]
name = "pebble-bounce"
version = "0.1.0"
edition = "2021"
authors = ["riceman2000"]

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = "debuginfo"
codegen-units = 1

[dependencies]
worker = { version = "0.8", features = ['http'] }
worker-macros = { version = "0.8", features = ['http'] }
http = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
